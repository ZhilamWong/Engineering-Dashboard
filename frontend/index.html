<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>Engineering Dashboard</h1>
            <p>Real-time system monitoring</p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            System Online
        </div>
    </header>

    <main>

        <section class="sensor-grid">

            <div class="sensor-card">
                <h2>Temperature</h2>
                <p id="temperature">-- °C</p>
                <span class="sensor-label">Current reading</span>
            </div>

            <div class="sensor-card">
                <h2>Voltage</h2>
                <p id="voltage">-- V</p>
                <span class="sensor-label">Current reading</span>
            </div>

            <div class="sensor-card">
                <h2>Current</h2>
                <p id="current">-- A</p>
                <span class="sensor-label">Current reading</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
