<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>Engineering Dashboard</h1>
            <p>Real-time system monitoring</p>
        </div>

        <div class="status">
            <span class="status-dot checking" id="api-status-dot"></span>
            <span id="api-status-text">Checking API…</span>
        </div>
    </header>

    <main>

        <section class="sensor-grid">

            <div class="sensor-card">
                <h2>Temperature</h2>
                <p id="temperature">-- °C</p>
                <span class="sensor-label">Current reading</span>
            </div>

            <div class="sensor-card">
                <h2>Battery</h2>
                <p id="battery-charge">--%</p>
                <span id="battery-status" class="sensor-label">Waiting for reading</span>
            </div>

        </section>

        <section class="chart-card">
            <h2>CPU temperature history</h2>
            <div class="chart-container">
                <canvas id="temperature-chart"></canvas>
            </div>
        </section>

        <section class="chart-card">
            <h2>Battery level over the last four hours</h2>
            <div class="chart-container">
                <canvas id="battery-chart"></canvas>
            </div>
            <p id="battery-trend">Collecting readings…</p>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js?v=9"></script>

</body>
</html>
